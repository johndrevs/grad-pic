<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slideshow Settings</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="page-shell">
    <main class="panel">
      <p class="eyebrow">Graduation Party</p>
      <h1>Slideshow settings</h1>
      <p class="lede">
        Control how the display page advances through photos on the device connected to the TV.
      </p>

      <form id="settings-form" class="stack">
        <label class="field">
          <span>Slide duration</span>
          <input id="duration-seconds" name="duration-seconds" type="number" min="3" max="120" step="1" required />
          <span class="muted">Seconds each image stays on screen.</span>
        </label>

        <label class="toggle-row" for="loop-enabled">
          <span>
            <strong>Loop slideshow</strong>
            <span class="muted block">If off, the slideshow stops on the last photo.</span>
          </span>
          <input id="loop-enabled" name="loop-enabled" type="checkbox" />
        </label>

        <button type="submit">Save settings</button>
      </form>

      <section class="stack">
        <div id="settings-status" class="status" aria-live="polite"></div>
        <a class="text-link" href="/display.html">Back to slideshow</a>
      </section>
    </main>

    <script src="/settings.js"></script>
  </body>
</html>
