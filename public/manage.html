<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Photos</title>
    <link rel="stylesheet" href="/styles.css?v=20260503c" />
  </head>
  <body class="page-shell">
    <main class="panel manage-panel">
      <p class="eyebrow">Graduation Party</p>
      <h1>Manage slideshow photos</h1>
      <p class="lede">
        Review the uploaded photos, select the ones you do not want shown, and remove them in one step.
      </p>

      <section class="manage-toolbar">
        <button id="select-all" type="button">Select all</button>
        <button id="clear-selection" type="button" class="secondary-button">Clear</button>
        <button id="refresh-photos" type="button" class="secondary-button">Refresh</button>
        <button id="delete-selected" type="button" class="danger-button">Delete selected</button>
      </section>

      <div id="manage-status" class="status" aria-live="polite">Loading photos...</div>
      <div id="selection-summary" class="muted">0 selected</div>
      <section id="photo-grid" class="manage-grid" aria-label="Uploaded photos"></section>

      <section class="stack">
        <a class="text-link" href="/">Back to upload page</a>
        <a class="text-link" href="/display.html">Back to slideshow</a>
      </section>
    </main>

    <script src="/manage.js?v=20260503c"></script>
  </body>
</html>
