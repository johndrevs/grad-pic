<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graduation Party Album</title>
    <link rel="stylesheet" href="/styles.css?v=20260523a" />
  </head>
  <body class="page-shell">
    <main class="panel">
      <p class="eyebrow">Graduation Party</p>
      <h1>Add photos to the live album</h1>
      <p class="lede">
        Connect to the party Wi-Fi, choose a few photos or short videos, and they will appear in the slideshow.
      </p>

      <form id="upload-form" class="stack">
        <label class="upload-drop" for="photos">
          <span class="upload-drop-title">1. Choose photos or videos</span>
          <span class="muted">Up to 10 at a time, common image formats plus MP4/MOV/WebM video.</span>
          <span class="upload-picker-button">Browse phone</span>
        </label>
        <input id="photos" class="sr-only-file-input" name="photos" type="file" accept="image/*,video/mp4,video/quicktime,video/webm,video/x-m4v,video/avi,video/x-msvideo" multiple required />
        <div id="selected-files" class="selected-files muted">No files selected yet.</div>
        <button id="upload-button" type="submit" class="hidden">2. Upload to slideshow</button>
      </form>

      <section class="stack">
        <div id="status" class="status" aria-live="polite">Waiting for uploads.</div>
        <a class="text-link" href="/display.html" target="_blank" rel="noreferrer">
          Open the TV slideshow page
        </a>
        <a class="text-link" href="/settings.html">
          Configure slideshow settings
        </a>
        <a class="text-link" href="/manage.html">
          Manage or delete slideshow photos
        </a>
      </section>
    </main>

    <script src="/upload.js?v=20260523a"></script>
  </body>
</html>
